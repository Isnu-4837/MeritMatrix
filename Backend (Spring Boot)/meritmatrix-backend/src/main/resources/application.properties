spring.application.name=meritmatrix-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-dry-mode-az09bfly-pooler.c-3.ap-southeast-1.aws.neon.tech/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}


# Neon computes sleep when idle, so allow time for the first connection
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# CORS – set to your deployed frontend URL in production
# e.g. https://meritmatrix.vercel.app
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}

spring.autoconfigure.exclude=org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration,org.springframework.boot.hibernate.autoconfigure.HibernateJpaAutoConfiguration